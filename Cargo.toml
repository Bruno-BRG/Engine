[workspace]
resolver = "3"
members = ["crates/*", "editor/src-tauri"]
default-members = ["editor/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
nexo-core = { path = "crates/nexo-core" }
nexo-render = { path = "crates/nexo-render" }
wgpu = "30"
bytemuck = { version = "1.25", features = ["derive"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
